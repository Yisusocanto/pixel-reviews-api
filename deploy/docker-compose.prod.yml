# Producción (Azure VM). Se ejecuta desde esta carpeta:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Estructura esperada en la VM:
#   ~/pixel/pixel-reviews-api/deploy   <- este archivo
#   ~/pixel/pixel-reviews-moderation   <- repo del moderador
#
# La base de datos NO está aquí: vive en Neon.
# Solo Caddy publica puertos; Redis y RabbitMQ quedan en la red interna.

services:
  caddy:
    image: caddy:2-alpine
    container_name: pixel-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m

  redis:
    image: redis:7-alpine
    container_name: pixel-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: pixel-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.4"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    mem_limit: 768m

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pixel-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 768m

  moderator:
    build:
      context: ../../pixel-reviews-moderation
      dockerfile: Dockerfile
    container_name: pixel-moderator
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      API_BASE_URL: http://api:8000
      MODERATION_SERVICE_KEY: ${MODERATION_SERVICE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-decision-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    mem_limit: 128m

volumes:
  redis_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
