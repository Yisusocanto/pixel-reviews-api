[project]
name = "pixel-reviews-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.108",
    "boto3-stubs~=1.43.108",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
